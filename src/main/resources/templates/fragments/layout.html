<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Brinquedos Esportivos'">Brinquedos Esportivos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="navbar-logo">
            <a th:href="@{/}">Brinquedos Esportivos</a>
        </div>
        <ul class="navbar-menu">
            <li><a th:href="@{/}">Home</a></li>

            <!-- VISÍVEL SOMENTE PARA USUÁRIOS NÃO LOGADOS -->
            <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a></li>
            <li sec:authorize="!isAuthenticated()"><a th:href="@{/signup}">Sign Up</a></li>

            <!-- VISÍVEL SOMENTE PARA USUÁRIOS LOGADOS -->
            <li sec:authorize="isAuthenticated()"><a th:href="@{/brinquedos/web}">Brinquedos</a></li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<main class="main-content">
    <div th:replace="${content}"></div>
</main>

<footer>
    <p>&copy; 2025 - Brinquedos Esportivos</p>
</footer>

</body>
</html>
