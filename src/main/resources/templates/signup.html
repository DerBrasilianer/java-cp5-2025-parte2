<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>

<div class="form-container">
    <h1>Cadastro</h1>

    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}">Usuário criado com sucesso</span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Erro no cadastro</span>
    </div>

    <form th:action="@{/signup}" method="post" class="form" autocomplete="off">
        <div class="form-group">
            <label for="signup-username">Usuário:</label>
            <input type="text" id="signup-username" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="signup-password">Senha:</label>
            <div class="password-container">
                <input type="password" id="signup-password" name="password" required autocomplete="new-password">
                <button type="button" class="toggle-password" onclick="togglePassword('signup-password')">|</button>
            </div>
        </div>
        <div class="form-group">
            <label for="role">Tipo de Usuário:</label>
            <select id="role" name="role" class="form-select" required>
                <option value="USER">Usuário Normal</option>
                <option value="ADMIN">Administrador</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Cadastrar</button>
        </div>
    </form>

    <p class="text-center">Já possui conta? <a th:href="@{/login}" class="link">Faça login</a></p>
</div>

<script>
    function togglePassword(fieldId) {
        const passwordInput = document.getElementById(fieldId);
        const toggleButton = passwordInput.parentNode.querySelector('.toggle-password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = '/';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = '|';
        }
    }

    // Garantir que os campos estejam vazios ao carregar
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('signup-username').value = '';
        document.getElementById('signup-password').value = '';
    });
</script>

</body>
</html>
