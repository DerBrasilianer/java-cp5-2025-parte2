<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>

<div class="form-container">
    <h1>Cadastro</h1>

    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}">Usuário criado com sucesso</span>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Erro no cadastro</span>
    </div>

    <form th:action="@{/signup}" method="post" class="form">
        <div class="form-group">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <div class="password-container">
                <input type="password" id="password" name="password" required>
                <button type="button" class="toggle-password" onclick="togglePassword()">|</button>
            </div>
        </div>
        <div class="form-group">
            <label for="role">Tipo de Usuário:</label>
            <select id="role" name="role" class="form-select" required>
                <option value="USER">Usuário Normal</option>
                <option value="ADMIN">Administrador</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Cadastrar</button>
        </div>
    </form>

    <p class="text-center">Já possui conta? <a th:href="@{/login}" class="link">Faça login</a></p>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleButton = document.querySelector('.toggle-password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = '/';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = '|';
        }
    }
</script>

</body>
</html>
