<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>
<div class="form-container">
    <h2>Login</h2>

    <form th:action="@{/login}" method="post" autocomplete="off">
        <div class="form-group">
            <label for="login-username">Usuário:</label>
            <input type="text" id="login-username" name="username" required autofocus autocomplete="off" />
            <div class="input-example">Exemplo: <em>admin</em></div>
        </div>

        <div class="form-group">
            <label for="login-password">Senha:</label>
            <div class="password-container">
                <input type="password" id="login-password" name="password" required autocomplete="off" />
                <button type="button" class="toggle-password" onclick="togglePassword('login-password')">|</button>
            </div>
            <div class="input-example">Exemplo: <em>adminpass</em></div>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="text-center">Não possui conta? <a th:href="@{/signup}" class="link">Cadastre-se</a></p>

    <p th:if="${param.error}" class="alert alert-error">Usuário ou senha inválidos</p>
    <p th:if="${param.logout}" class="alert alert-success">Logout realizado com sucesso</p>
</div>

<script>
    function togglePassword(fieldId) {
        const passwordInput = document.getElementById(fieldId);
        const toggleButton = passwordInput.parentNode.querySelector('.toggle-password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = '/';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = '|';
        }
    }

    // Garantir que os campos estejam vazios ao carregar
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    });
</script>

<style>
    .input-example {
        font-size: 0.85rem;
        color: #666;
        margin-top: 0.3rem;
        font-style: italic;
    }
</style>
</body>
</html>
