<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>
<div class="form-container">
    <h2>Login</h2>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" placeholder="admin" required autofocus />
        </div>

        <div class="form-group">
            <label for="password">Senha:</label>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="adminpass" required />
                <button type="button" class="toggle-password" onclick="togglePassword()">|</button>
            </div>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="text-center">Não possui conta? <a th:href="@{/signup}" class="link">Cadastre-se</a></p>

    <p th:if="${param.error}" class="alert alert-error">Usuário ou senha inválidos</p>
    <p th:if="${param.logout}" class="alert alert-success">Logout realizado com sucesso</p>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleButton = document.querySelector('.toggle-password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = '/';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = '|';
        }
    }
</script>
</body>
</html>
