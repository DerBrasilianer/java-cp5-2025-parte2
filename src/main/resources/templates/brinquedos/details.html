<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>

<div class="details-container">
    <div class="page-header">
        <h1>Detalhes do Brinquedo</h1>
    </div>

    <div class="details-card">
        <div class="detail-item">
            <label>ID:</label>
            <span th:text="${brinquedo.id}"></span>
        </div>
        <div class="detail-item">
            <label>Nome:</label>
            <span th:text="${brinquedo.nome}"></span>
        </div>
        <div class="detail-item">
            <label>Preço:</label>
            <span th:text="'R$ ' + ${#numbers.formatDecimal(brinquedo.preco, 1, 2, 'POINT')}"></span>
        </div>
    </div>

    <div class="details-actions">
        <!-- Apenas ADMIN pode editar -->
        <a th:href="@{/brinquedos/web/{id}/edit(id=${brinquedo.id})}"
           class="btn-edit"
           th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Editar Brinquedo</a>
        <a th:href="@{/brinquedos/web}" class="btn-secondary">Voltar para Lista</a>
    </div>
</div>

</body>
</html>
