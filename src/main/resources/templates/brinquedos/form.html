<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>

<div class="form-container">
    <h1 th:text="${brinquedo.id} != null ? 'Editar Brinquedo' : 'Novo Brinquedo'">Formulário</h1>

    <form th:action="@{${actionUrl}}" method="post" class="form">
        <input type="hidden" name="id" th:value="${brinquedo.id}">

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" th:value="${brinquedo.nome}" required>
        </div>

        <div class="form-group">
            <label for="preco">Preço:</label>
            <input type="number" id="preco" name="preco" step="0.01" th:value="${brinquedo.preco}" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <a th:href="@{/brinquedos/web}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
