<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>

<div class="content-container">
    <div class="page-header">
        <h1>Catálogo de Brinquedos</h1>
        <a th:href="@{/brinquedos/web/new}" class="btn-brand">Adicionar Brinquedo</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${brinquedos}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.nome}"></td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(b.preco, 1, 2, 'POINT')}"></td>
                <td>
                    <div class="table-actions">
                        <a th:href="@{/brinquedos/web/{id}(id=${b.id})}" class="btn-view">Ver</a>
                        <!-- Apenas ADMIN pode editar -->
                        <a th:href="@{/brinquedos/web/{id}/edit(id=${b.id})}"
                           class="btn-edit"
                           th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Editar</a>
                        <!-- Apenas ADMIN pode excluir -->
                        <form th:action="@{/brinquedos/{id}/delete(id=${b.id})}"
                              method="post"
                              class="inline-form"
                              th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                            <button type="submit" class="btn-delete" onclick="return confirm('Tem certeza que deseja excluir este brinquedo?')">Excluir</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
