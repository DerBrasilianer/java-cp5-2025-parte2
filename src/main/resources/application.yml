spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/java-cp5-2025-db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:120304}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${FORMAT_SQL:false}

  application:
    name: brinquedos-revisao

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${PORT:8081}

logging:
  level:
    org:
      springframework:
        security: ${SECURITY_LOG_LEVEL:INFO}
        web: ${WEB_LOG_LEVEL:INFO}